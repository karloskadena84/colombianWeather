<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colombian Weather — Carlos Cadena</title>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      font-family:Raleway,system-ui,sans-serif;color:#fff;
      background:linear-gradient(160deg,#04121b,#0a2a3a 50%,#04121b);text-align:center;padding:2rem;}
    .box{max-width:32rem;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);
      border-radius:1.5rem;padding:2rem;backdrop-filter:blur(20px);}
    h1{font-size:1.75rem;margin:0 0 .5rem;}
    p{opacity:.85;line-height:1.5;}
    code{background:rgba(0,0,0,.35);padding:.15rem .4rem;border-radius:.35rem;font-size:.9em;}
    a{color:#8ac926;}
  </style>
</head>
<body>
  <div class="box">
    <h1>Colombian Weather</h1>
    <p>Dashboard de clima para Colombia · <strong>Carlos Cadena</strong></p>
    <p>Sube el archivo <code>index.html</code> completo desde tu carpeta local<br>
    (<code>weather-dashboard-colombia</code>) a este repositorio para publicar la app.</p>
    <p><a href="https://github.com/karloskadena84/colombianWeather">Ver repositorio en GitHub</a></p>
  </div>
</body>
</html>
